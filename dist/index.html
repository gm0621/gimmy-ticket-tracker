<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gimmy 的 7.0.102 工單進度、到期項目與已完成工作。">
  <title>Gimmy 工單進度</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top"><div class="frame top-inner">
    <span class="identity"><span class="mark" aria-hidden="true">G</span> NP-RD <span class="slash">/</span> 7.0.102</span>
    <a data-source target="_blank" rel="noopener">原始試算表</a>
  </div></header>
  <main class="frame">
    <section class="intro" aria-labelledby="title">
      <div><h1 id="title">Gimmy 工單進度</h1><p>負責、參與或在工單內容中提及 Gimmy 的項目。</p></div>
      <div class="sync">
        <p id="sync-state" role="status">正在讀取試算表…</p>
        <button id="refresh" type="button">更新資料</button>
      </div>
    </section>
    <section class="metrics" aria-label="工單統計">
      <div class="metric"><span>未完成項目</span><strong id="open-count">–</strong></div>
      <div class="metric due"><span>11/30 到期</span><strong id="due-count">–</strong></div>
      <div class="metric future"><span>12 月排定開始</span><strong id="dec-count">–</strong></div>
      <div class="metric"><span>已完成項目</span><strong id="done-count">–</strong></div>
    </section>
    <section class="board" aria-label="工單明細">
      <div class="toolbar">
        <div class="views" aria-label="工單檢視">
          <button type="button" data-view="open" aria-pressed="true">未完成</button>
          <button type="button" data-view="all" aria-pressed="false">完整工單</button>
          <button type="button" data-view="done" aria-pressed="false">已完成</button>
        </div>
        <label class="search"><span class="sr-only">搜尋工單</span><input type="search" id="search" placeholder="搜尋工單或子任務"></label>
      </div>
      <div class="table-meta">
        <p id="result" aria-live="polite"></p>
        <label class="filter">追蹤重點
          <select id="filter">
            <option value="">全部</option>
            <option value="due">11/30 到期</option>
            <option value="dec">12 月排定開始</option>
            <option value="late">已逾預計結束日</option>
          </select>
        </label>
      </div>
      <div class="table-scroll" tabindex="0" role="region" aria-label="工單表，可橫向捲動">
        <table>
          <thead><tr><th scope="col">工單</th><th scope="col">項目／子任務</th><th scope="col">負責／參與</th><th scope="col">預計開始</th><th scope="col" id="end-heading" aria-sort="ascending">預計結束</th><th scope="col">進度</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <footer>有實際結束日的項目列為已完成。紅色逾期標記依台北日期判定。11/30 與 12 月標記對應 2026 年 11 月 27 日的報告。</footer>
  </main>
</body>
</html>
