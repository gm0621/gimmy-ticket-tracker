<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gimmy 的 7.0.102 工單進度、到期項目與已完成工作。">
  <title>Gimmy 工單進度</title>
  <link rel="stylesheet" href="./style.css?v=task-sheet-jump">
  <script type="module" src="./app.js?v=task-sheet-jump"></script>
</head>
<body>
  <header class="top"><div class="frame top-inner">
    <span class="identity"><span class="mark" aria-hidden="true">G</span> NP-RD <span class="slash">/</span> 7.0.102</span>
    <a data-source target="_blank" rel="noopener">原始試算表</a>
  </div></header>
  <main class="frame">
    <section class="intro" aria-labelledby="title">
      <div><h1 id="title">Gimmy 工單進度</h1><p>負責、參與或在工單內容中提及 Gimmy 的項目。</p></div>
      <div class="sync">
        <p id="sync-state" role="status">正在讀取試算表…</p>
        <button id="refresh" type="button">更新資料</button>
      </div>
    </section>
    <section class="metrics" aria-label="工單統計">
      <button class="metric" type="button" data-card-view="open" aria-pressed="true" aria-controls="rows"><span>未完成項目</span><strong id="open-count">–</strong></button>
      <button class="metric due" type="button" data-filter="due" aria-pressed="false" aria-controls="rows"><span>11/30 到期</span><strong id="due-count">–</strong></button>
      <button class="metric future" type="button" data-filter="dec" aria-pressed="false" aria-controls="rows"><span>12 月排定開始</span><strong id="dec-count">–</strong></button>
      <button class="metric" type="button" data-card-view="done" aria-pressed="false" aria-controls="rows"><span>已完成項目</span><strong id="done-count">–</strong></button>
    </section>
    <section class="metrics date-metrics" aria-label="依台北日期篩選工單">
      <button class="metric overdue" type="button" data-filter="late" aria-pressed="false" aria-controls="rows"><span>已逾期</span><strong id="late-count">–</strong></button>
      <button class="metric due" type="button" data-filter="today" aria-pressed="false" aria-controls="rows"><span>今天到期</span><strong id="today-count">–</strong></button>
      <button class="metric upcoming" type="button" data-filter="week" aria-pressed="false" aria-controls="rows"><span>未來 7 天到期</span><strong id="week-count">–</strong></button>
      <button class="metric completed" type="button" data-filter="done-week" data-filter-view="done" aria-pressed="false" aria-controls="rows"><span>本週完成</span><strong id="done-week-count">–</strong></button>
    </section>
    <section class="board" aria-label="工單明細">
      <div class="toolbar">
        <div class="views" aria-label="工單檢視">
          <button type="button" data-view="open" aria-pressed="true">未完成</button>
          <button type="button" data-view="all" aria-pressed="false">完整工單</button>
          <button type="button" data-view="done" aria-pressed="false">已完成</button>
        </div>
        <label class="search"><span class="sr-only">搜尋工單</span><input type="search" id="search" placeholder="搜尋工單或子任務"></label>
      </div>
      <div class="table-meta">
        <p id="result" aria-live="polite"></p>
        <label class="filter">追蹤重點
          <select id="filter">
            <option value="">全部</option>
            <option value="due" data-filter-scope="open">11/30 到期</option>
            <option value="dec" data-filter-scope="open">12 月排定開始</option>
            <option value="late" data-filter-scope="open">已逾期</option>
            <option value="today" data-filter-scope="open">今天到期</option>
            <option value="week" data-filter-scope="open">未來 7 天到期</option>
            <option value="done-week" data-filter-scope="done" hidden disabled>本週完成</option>
          </select>
        </label>
      </div>
      <div class="ticket-list" role="region" aria-label="工單表">
        <table class="ticket-table" role="table">
          <thead role="rowgroup"><tr role="row"><th scope="col">工單</th><th scope="col">項目</th><th scope="col" id="end-heading">下一個到期日</th><th scope="col">已完成／總數</th></tr></thead>
          <tbody id="rows" role="rowgroup"></tbody>
        </table>
      </div>
    </section>
    <footer>日期篩選依台北時間判定。未來 7 天從明天起算。本週完成依週一至今天的實際結束日判定。已完成／總數以整張工單的明細計算。11/30 與 12 月標記對應 2026 年 11 月 27 日的報告。</footer>
  </main>
</body>
</html>
